name: Reproduce analysis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Install R packages
        run: Rscript install_packages.R
      - name: Run analysis
        env:
          REFRESH_DATA: "false"
        run: Rscript run_all.R
